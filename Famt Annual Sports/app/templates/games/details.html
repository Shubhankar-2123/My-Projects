{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h3>{{ game.name }}</h3>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Type:</strong> {{ game.type }}</p>
                    <p><strong>Department:</strong> {{ game.department }}</p>
                    <p><strong>Start Date:</strong> {{ game.start_date }}</p>
                </div>
                <div class="col-md-6">
                    <h5>Rules</h5>
                    <p>{{ game.rules }}</p>
                </div>
            </div>
            <hr>
            <form method="POST" action="{{ url_for('games.register', game_id=game._id) }}">
                <button type="submit" class="btn btn-success">Register Now</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
