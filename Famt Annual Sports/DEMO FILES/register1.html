<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | College Sports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 3rem auto;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .department-badges .form-check {
            display: inline-block;
            margin-right: 8px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-container bg-white">
            <div class="text-center mb-4">
                <img src="/static/images/logo.png" height="50" alt="Logo">
                <h2 class="mt-3">Create Account</h2>
            </div>

            <form method="POST" action="/register">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="firstName" name="firstName" placeholder="John" required>
                            <label for="firstName">First Name</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Doe" required>
                            <label for="lastName">Last Name</label>
                        </div>
                    </div>
                </div>

                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                    <label for="email">Email address</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                    <label for="password">Password</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
                    <label for="confirmPassword">Confirm Password</label>
                </div>

                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <div class="department-badges">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="department" id="cs" value="CS" checked>
                            <label class="form-check-label" for="cs">Computer Science</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="department" id="ece" value="ECE">
                            <label class="form-check-label" for="ece">Electronics</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="department" id="mech" value="MECH">
                            <label class="form-check-label" for="mech">Mechanical</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Create Account</button>
                <div class="text-center">
                    <p class="text-muted">Already have an account? <a href="login1.html" class="text-decoration-none">Sign in</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
